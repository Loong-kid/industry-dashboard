name: update-equipment
on:
  schedule:
    - cron: "30 23 * * *" # KST 08:30
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Validate financial definitions and fiscal periods
        run: |
          python -m unittest discover -s scripts -p test_equipment_companies.py -v
          python -m unittest discover -s scripts -p test_asml_history.py -v
      - name: Refresh public SEC and DART company accounts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python scripts/fetch_equipment_hanmi.py
          python scripts/fetch_equipment_companies.py
      - name: Validate published equipment history
        run: |
          python -m unittest discover -s scripts -p test_equipment_companies.py -v
          python -m unittest discover -s scripts -p test_asml_history.py -v
      - name: Commit equipment accounts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manual/equipment_hanmi.json data/semicon/equipment_state.json
          for company in lam amat kla teradyne asml tel asm screen disco besi hanmi camtek advantest; do
            git add data/semicon/company_${company}_revenue.json data/semicon/company_${company}_profit.json data/semicon/company_${company}_capex.json
          done
          git add data/semicon/equipment_asml_revenue_mix.json data/semicon/equipment_screen_spe.json data/semicon/equipment_disco_shipments.json data/semicon/equipment_besi_orders.json
          git diff --cached --quiet || git commit -m "chore: refresh equipment company accounts"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
  korea:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Validate Korean equipment definitions
        id: precheck
        continue-on-error: true
        run: python -m unittest discover -s scripts -p test_korea_equipment.py -v
      - name: Refresh original Korean equipment accounts
        if: steps.precheck.outcome == 'success'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u scripts/fetch_korea_equipment.py --refresh
      - name: Validate refreshed Korean equipment history
        id: postcheck
        if: steps.precheck.outcome == 'success'
        continue-on-error: true
        run: python -m unittest discover -s scripts -p test_korea_equipment.py -v
      - name: Commit Korean equipment documents only
        if: steps.precheck.outcome == 'success' && steps.postcheck.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/semicon/company_kr_equipment_*.json data/semicon/korea_equipment_state.json data/semicon/korea_equipment_universe.json
          git diff --cached --quiet || git commit -m "chore: refresh Korean equipment issuer financials"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
      - name: Report Korean equipment validation failure
        if: steps.precheck.outcome == 'failure' || steps.postcheck.outcome == 'failure'
        run: exit 1
