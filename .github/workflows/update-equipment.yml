name: update-equipment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: korea-equipment-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect original Korean equipment accounts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u scripts/fetch_korea_equipment.py --refresh --full-history
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-equipment-bootstrap
          path: |
            .cache/korea-equipment/
            data/semicon/korea_equipment_state.json
          include-hidden-files: true
