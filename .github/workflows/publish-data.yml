name: publish-updated-data

on:
  workflow_run:
    workflows: [update-data, update-ppi, update-games, update-offshore, update-offshore-valuation, update-cpu, update-power-semicon, update-equipment, update-telecom, update-natgas, update-oil, update-refining, update-quantum, update-shipbuilding-equipment, update-lng-containment, update-drone, update-mining, update-rings, update-solar, update-us-datacenter, update-neocloud, update-cosmetics, update-entertainment, update-semicon-valuation, update-copper-valuation, update-mining-valuation, update-specialty-minerals, update-vrar, update-semicon-cleaning, update-semicon-osat, update-expansion, update-movies, update-national-budget, update-hybe-labels, update-us-treasury, update-cleanroom, update-semicon-supplychain, update-mocvd-guidance]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/**
      - .github/workflows/publish-data.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-updated-data
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # The collector commits a new head, so use main instead of its starting SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare public site only
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages sometimes cannot see the artifact this run just uploaded ("No artifacts named
      # github-pages"), mostly when many collectors finish together. Retry once with a fresh artifact
      # instead of failing the run and emailing the owner (2026-11-24: 16 such failures in one day).
      - name: Deploy updated data
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Upload the site again for the retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-retry
      - name: Deploy updated data (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-retry
