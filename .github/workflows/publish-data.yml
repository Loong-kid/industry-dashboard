name: publish-updated-data

on:
  workflow_run:
    workflows: [update-data, update-ppi, update-games, update-offshore, update-offshore-valuation, update-cpu, update-power-semicon, update-equipment, update-telecom, update-natgas, update-oil, update-refining, update-quantum, update-shipbuilding-equipment, update-lng-containment, update-drone, update-mining, update-rings, update-solar, update-us-datacenter, update-neocloud, update-cosmetics, update-entertainment, update-semicon-valuation, update-copper-valuation, update-mining-valuation, update-specialty-minerals, update-vrar, update-semicon-cleaning, update-semicon-osat, update-expansion, update-movies, update-national-budget, update-hybe-labels, update-us-treasury, update-cleanroom, update-semicon-supplychain, update-mocvd-guidance, update-energy-market]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/**
      - .github/workflows/publish-data.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-updated-data
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      # The collector commits a new head, so use main instead of its starting SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare public site only
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages sometimes cannot see the artifact this run just uploaded ("Found 0/1 artifact(s)"
      # then "No artifacts named ..."): GitHub's artifact listing lags right after the upload
      # (2026-11-24: 16 such failures in one day). Re-uploading under a new name hit the same lag
      # (2026-11-25), so wait and retry the SAME artifact, twice, before failing the run.
      - name: Deploy updated data
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait for the artifact listing to catch up
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy updated data (retry 1)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait longer before the last retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 120
      - name: Deploy updated data (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
