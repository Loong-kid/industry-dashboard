name: update-natgas
on:
  schedule:
    - cron: '55 23 * * *' # 매일 KST 08:55
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  lng_carriers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 'PyMuPDF>=1.24,<2'
      - name: Validate FLNG and GLNG reporting periods and income scope
        id: precheck
        continue-on-error: true
        run: python -m unittest discover -s scripts -p test_lng_carriers.py
      - name: Check SEC annual audits and original issuer quarter releases
        if: steps.precheck.outcome == 'success'
        run: python -u scripts/fetch_lng_carriers.py
      - name: Validate published carrier histories
        id: postcheck
        continue-on-error: true
        if: steps.precheck.outcome == 'success'
        run: python scripts/validate_lng_carriers.py
      - name: Preserve public source data for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lng-carriers-public-data
          path: |
            data/natgas/lng_carriers_state.json
            data/natgas/carrier_*.json
          retention-days: 7
      - name: Commit carrier financials only
        if: steps.precheck.outcome == 'success' && steps.postcheck.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/natgas/lng_carriers_state.json data/natgas/carrier_*.json
          git diff --cached --quiet || git commit -m "chore: refresh LNG carrier financials"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
      - name: Report carrier validation failure
        if: steps.precheck.outcome == 'failure' || steps.postcheck.outcome == 'failure'
        run: exit 1
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas xlrd beautifulsoup4
      - name: Validate price conversion and failure isolation
        run: python -m unittest discover -s scripts -p test_natgas_prices.py
      - name: Check gas prices independently of other industries
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u scripts/fetch_natgas.py
      - name: Commit gas price observations only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/natgas/ng_*.json data/natgas/lng_equities.json data/natgas/fertilizer.json
          git diff --cached --quiet || git commit -m "chore: refresh natural gas prices"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
  midstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate fiscal flows and horsepower definitions
        run: python -m unittest discover -s scripts -p test_midstream.py
      - name: Check SEC accounts and original operating-data tables
        run: python -u scripts/fetch_midstream.py
      - name: Validate collected histories
        run: python -m unittest discover -s scripts -p test_midstream.py
      - name: Commit midstream accounts and operating data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/natgas/midstream_state.json data/natgas/company_*.json data/natgas/compressor_*.json
          git diff --cached --quiet || git commit -m "chore: refresh gas midstream and compressor accounts"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
