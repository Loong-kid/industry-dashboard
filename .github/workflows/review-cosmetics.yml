name: review-cosmetics-sources
on:
  workflow_dispatch:
    inputs:
      recent_only:
        description: Collect two recent years and official preliminary quarters
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  statements:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect original cosmetics company statements
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u scripts/collect_cosmetics_sources.py ${{ inputs.recent_only && '' || '--full-history' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmetics-original-statements
          path: .cache/cosmetics/
          include-hidden-files: true
          retention-days: 3
