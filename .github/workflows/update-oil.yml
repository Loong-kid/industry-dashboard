name: update-oil
on:
  schedule:
    - cron: '35 23 * * *' # KST 08:35; original quarterly disclosures
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml openpyxl pymupdf
      - name: Validate definitions, statements and navigation
        run: python -m unittest discover -s scripts -p test_oil.py
      - name: Check public SEC and issuer originals independently
        run: python -u scripts/fetch_oil.py
      - name: Validate updated financial histories
        run: python -m unittest discover -s scripts -p test_oil.py
      - name: Commit oil data and source registry only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oil/ manual/oil/source_files.json
          git diff --cached --quiet || git commit -m "chore: refresh oil major financial statements"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
