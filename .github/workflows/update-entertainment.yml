name: update-entertainment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vrar-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect original Korean VRAR statements
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u scripts/collect_vrar_korea.py --full-history
      - uses: actions/upload-artifact@v4
        with:
          name: vrar-korea-bootstrap
          path: |
            .cache/vrar/korea/
            data/vrar/korea_state.json
          include-hidden-files: true
