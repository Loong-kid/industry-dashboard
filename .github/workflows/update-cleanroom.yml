name: update-cleanroom
on:
  schedule:
    - cron: '25 0 * * *' # KST 09:25
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 PyMuPDF
      - uses: actions/cache@v4
        with:
          path: .cache/cleanroom/ir
          key: cleanroom-ir-${{ github.run_id }}
          restore-keys: cleanroom-ir-
      - name: Validate cleanroom sources and history
        id: precheck
        continue-on-error: true
        run: python -m unittest discover -s scripts -p test_cleanroom.py -v
      - name: Refresh selected cleanroom issuer accounts
        id: collect
        if: steps.precheck.outcome == 'success'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u scripts/fetch_cleanroom.py --refresh
      - name: Validate refreshed publication
        id: postcheck
        if: steps.precheck.outcome == 'success'
        continue-on-error: true
        run: python -m unittest discover -s scripts -p test_cleanroom.py -v
      - name: Commit cleanroom data only
        if: steps.precheck.outcome == 'success' && steps.postcheck.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/semicon/cleanroom_state.json data/semicon/cleanroom_domestic_state.json data/semicon/company_cleanroom_*.json data/semicon/cleanroom_universe.json
          git diff --cached --quiet || git commit -m "chore: refresh cleanroom and HVAC issuer accounts"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
      - name: Report validation failure
        if: steps.precheck.outcome == 'failure' || steps.postcheck.outcome == 'failure'
        run: exit 1
