name: review-mining-sources
on:
  workflow_dispatch:
    inputs:
      company:
        description: Optional issuer key for a focused statement review
        required: false
        default: ''
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect SEC issuer statements
        env:
          ISSUER: ${{ inputs.company }}
        run: |
          if [ -n "$ISSUER" ]; then
            python -u scripts/collect_mining_sources.py --company "$ISSUER"
          else
            python -u scripts/collect_mining_sources.py
          fi
      - run: python -u scripts/collect_mining_ir.py
        if: inputs.company == ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mining-public-originals
          path: .cache/mining/
          include-hidden-files: true
          retention-days: 3
