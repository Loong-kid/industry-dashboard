name: review-mining-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -u scripts/collect_mining_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mining-public-originals
          path: .cache/mining/
          include-hidden-files: true
          retention-days: 3
