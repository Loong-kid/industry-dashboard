name: review-vrar-contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect original Sapien contract filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u scripts/collect_vrar_contract_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrar-contract-originals
          path: .cache/vrar/contracts/
          include-hidden-files: true
          retention-days: 3
