name: update-quantum
on:
  schedule:
    - cron: '10 0 * * *' # KST 09:10
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*quantum*.py'
      - 'manual/quantum/**'
      - 'data/quantum/**'
      - 'assets/quantum.*'
      - 'assets/app.js'
      - 'data/catalog.json'
      - '.github/workflows/update-quantum.yml'
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  quantum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate fiscal periods, SPAC exclusions and ETF position types
        id: precheck
        continue-on-error: true
        run: python -m unittest discover -s scripts -p test_quantum.py -v
      - name: Collect free SEC accounts, reviewed issuer tables, ECB and ETF holdings
        if: steps.precheck.outcome == 'success'
        run: python -u scripts/fetch_quantum.py
      - name: Validate public data and provenance
        id: postcheck
        if: steps.precheck.outcome == 'success'
        continue-on-error: true
        run: python scripts/validate_quantum.py
      - name: Preserve public data for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-public-data
          path: data/quantum/
          retention-days: 3
      - name: Commit quantum data only
        if: github.event_name != 'pull_request' && steps.precheck.outcome == 'success' && steps.postcheck.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quantum/
          git diff --cached --quiet || git commit -m "chore: refresh quantum accounts and ETF holdings"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
      - name: Report a quantum validation failure
        if: steps.precheck.outcome == 'failure' || steps.postcheck.outcome == 'failure'
        run: exit 1
