name: update-neocloud
on:
  schedule:
    - cron: '10 1 * * *' # KST 10:10
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  neocloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate neocloud accounts and scopes
        id: precheck
        continue-on-error: true
        run: |
          python -m unittest discover -s scripts -p test_neocloud.py -v
          node scripts/test_us_datacenter.cjs
      - name: Refresh disclosed neocloud financials
        if: steps.precheck.outcome == 'success'
        run: python -u scripts/fetch_neocloud.py
      - name: Validate publication
        id: postcheck
        if: steps.precheck.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest discover -s scripts -p test_neocloud.py -v
          node scripts/test_us_datacenter.cjs
      - name: Commit neocloud data only
        if: steps.precheck.outcome == 'success' && steps.postcheck.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/datacenter/us_nc_*.json data/datacenter/us_neocloud_state.json
          git diff --cached --quiet || git commit -m "chore: refresh neocloud financial history"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
      - name: Report validation failure
        if: steps.precheck.outcome == 'failure' || steps.postcheck.outcome == 'failure'
        run: exit 1
