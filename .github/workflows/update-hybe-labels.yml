name: update-hybe-labels
on:
  workflow_run:
    workflows: [update-entertainment]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '35 1 * * 0' # KST Sunday 10:35 fallback
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  hybe-labels:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - uses: actions/cache@v4
        with:
          path: .cache/hybe-labels
          key: hybe-labels-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: hybe-labels-v1-${{ runner.os }}-
      - name: Validate label units and contract evidence
        id: precheck
        continue-on-error: true
        run: |
          python -m unittest discover -s scripts -p test_hybe_labels.py -v
          node scripts/test_hybe_labels.cjs
      - name: Refresh original DART label notes and roster
        if: steps.precheck.outcome == 'success'
        run: python -u scripts/fetch_hybe_labels.py
      - name: Validate publication
        id: postcheck
        continue-on-error: true
        if: steps.precheck.outcome == 'success'
        run: python -m unittest discover -s scripts -p test_hybe_labels.py -v
      - name: Commit HYBE label document only
        if: steps.precheck.outcome == 'success' && steps.postcheck.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/entertainment/hybe_labels.json
          git diff --cached --quiet || git commit -m "chore: refresh HYBE label notes and artist roster"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Report validation failure
        if: steps.precheck.outcome == 'failure' || steps.postcheck.outcome == 'failure'
        run: exit 1
