name: update-data

on:
  schedule:
    - cron: "30 22 * * *" # 매일 KST 07:30
  workflow_dispatch: # 사이트의 '수주 갱신' 버튼이 이걸 호출
    inputs:
      shipping_only:
        description: 해운 시장지표만 수집·검증
        type: boolean
        default: false
      construction_only:
        description: 구리 탭 중국·미국 건설 지표만 수집·검증
        type: boolean
        default: false
      datacenter_only:
        description: 국내 데이터센터 공개 허가·착공 자료만 수집·검증
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data # 버튼 연타/스케줄 겹침 시 직렬화(중간취소 안 함)
  cancel-in-progress: false

jobs:
  datacenter:
    if: inputs.datacenter_only == true && inputs.shipping_only != true && inputs.construction_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 데이터센터 매칭·중복·예정일 집계 검증
        run: python -m unittest discover -s scripts -p test_korea_datacenter.py -v
      - name: 데이터센터 표·필터 검증
        run: node scripts/test_korea_datacenter.cjs
      - name: 공개 건축허가·착공 자료 수집
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/fetch_korea_datacenter.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/datacenter/
          git diff --cached --quiet || git commit -m "chore: refresh Korean data centres"
          git pull --rebase
          git push
  construction:
    if: inputs.construction_only == true && inputs.shipping_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 건설 지표 파서·이력 보존 검증
        run: python -m unittest discover -s scripts -p test_copper_construction.py -v
      - name: 건설 카드 표시 기준·구리 탭 검증
        run: |
          node scripts/test_construction_cards.cjs
          node scripts/test_commodity_tabs.cjs
      - name: 중국·미국 건설 지표 수집
        run: python scripts/fetch_copper_construction.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/commodities/comm_copper_cn_*.json data/commodities/comm_copper_us_*.json
          git diff --cached --quiet || git commit -m "chore: refresh copper construction indicators"
          git pull --rebase
          git push
  shipping:
    if: inputs.shipping_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 운임 파서·실패 격리 검증
        run: python -m unittest discover -s scripts -p test_shipping_fetchers.py -v
      - name: 해운 시장지표 수집
        run: python scripts/fetch_all.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/
          git diff --cached --quiet || (git commit -m "chore: refresh shipping market data" && git push)
  update:
    if: inputs.shipping_only != true && inputs.construction_only != true && inputs.datacenter_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: 국내 데이터센터 수집기·표 검증
        run: |
          python -m unittest discover -s scripts -p test_korea_datacenter.py
          node scripts/test_korea_datacenter.cjs
      - name: 국내 데이터센터 공개 자료 확인
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/fetch_korea_datacenter.py

      # 해운/조선 시장지표 (KOBC/KCLA/StockQ/TI VLCC 성약). 실패해도 DART는 진행.
      - name: 시장지표 수집
        continue-on-error: true
        run: python scripts/fetch_all.py

      # 매크로 지표 (FRED — CPI/PCE/PPI 전년비, 기대인플레이션, 금리). API 전용.
      - name: FRED 매크로 수집
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_fred.py

      # 일간 TGA 마감 잔고·오버나이트 RRP (재무부 API·FRED 공개 CSV, 키 없음).
      - name: TGA·RRP 수집기 검증
        run: python -m unittest discover -s scripts -p test_liquidity.py
      - name: 미국 유동성 수집
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/fetch_liquidity.py

      - name: 연준 지준 회계식 검증
        run: python -m unittest discover -s scripts -p test_fed_reserves.py
      - name: 연준 대차대조표·지원 창구·지준 수집
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/fetch_fed_reserves.py

      # 글로벌 국채 10/30년 (미 FRED · 한 ECOS · 일 MOF CSV).
      - name: 글로벌 국채 수집
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/fetch_global_bonds.py

      # 국가별 정부부채·GDP·재정수지(IMF WEO, 키 없음) + BIS 분기 부채·OECD 10년 금리(FRED) + 중국 10년(일별 누적)
      - name: 국가별 부채·금리 수집
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_sovereign.py

      # 연간 시장규모도 매일 새 공표·정정 확인. WB·ECOS·ESMA·SIFMA·S&P 수집.
      - name: 주식·채권 시장규모 수집
        continue-on-error: true
        timeout-minutes: 8
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/fetch_market_size.py

      # 원자재 금·은·구리·팔라듐 (Yahoo Finance 선물, 키 없음).
      - name: 원자재 수집
        continue-on-error: true
        run: python scripts/fetch_commodities.py

      - name: 구리 수요 · 중국·미국 건설 지표 수집
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/fetch_copper_construction.py

      - name: 우라늄·농축·KOMIS 전체 광물 가격 수집
        continue-on-error: true
        run: python scripts/fetch_mineral_prices.py

      - name: 광물 관련 기업 공시·기간·통화 검증
        run: |
          python -m unittest discover -s scripts -p test_mineral_companies.py
          node scripts/test_mineral_company_cards.cjs
          node scripts/test_commodity_tabs.cjs
      - name: 광물 관련 6개 기업 주가·영업이익·생산량 수집
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/fetch_mineral_companies.py

      - name: ESS 기업 공시·배치·수주 집계 검증
        run: |
          python -m unittest discover -s scripts -p test_ess_companies.py
          node scripts/test_ess_company_cards.cjs
      - name: ESS 기업 매출·배치·수주 공시 수집
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/fetch_ess_companies.py

      - name: 광물 국가별 생산량·매장량 파서 검증
        run: python -m unittest discover -s scripts -p test_mineral_supply.py
      - name: 광물 국가별 생산량·매장량 수집
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/fetch_mineral_supply.py
      - name: 구리 세계 전체 생산량·매장량 파서 검증
        run: python -m unittest discover -s scripts -p test_copper_world_supply.py
      - name: 구리 세계 전체 생산량·매장량 수집
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/fetch_copper_world_supply.py

      - name: 한국 광물 수출입 기간·단위·전체 합계 검증
        run: python -m unittest discover -s scripts -p test_korea_mineral_trade.py
      - name: 한국 광물 73종 수입·수출 수집
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/fetch_korea_mineral_trade.py --workers 4

      - name: SHFE 구리 주간 재고 수집
        continue-on-error: true
        run: python scripts/fetch_copper_inventory.py

      - name: SHFE 구리 일간 창고증권 수집
        continue-on-error: true
        run: python scripts/fetch_copper_warrants.py

      - name: COMEX·LME 구리 재고 공개 스냅샷 수집
        continue-on-error: true
        run: python scripts/fetch_copper_snapshot.py

      - name: COMEX·LME 구리 재고 과거 자료 보충
        continue-on-error: true
        run: python scripts/fetch_copper_history.py

      - name: 3대 거래소 구리 합산 재고 계산
        continue-on-error: true
        run: python scripts/derive_copper_inventory.py

      - name: 양산 프리미엄 공개 일일 자료 확인
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/fetch_yangshan.py

      # 천연가스·비료 (FRED 키 + Yahoo, 구 natgas-monitor 이관)
      - name: 천연가스 수집
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_natgas.py
      # 미국 LNG 액화 프로젝트 (EIA 워크북 xlsx, 키 없음). 발표분 빈티지 보관 포함.
      - name: LNG 프로젝트 수집
        continue-on-error: true
        run: python scripts/fetch_lng_projects.py

      # FLNG 선단(수기 CSV) — 무료 정형 소스가 없어 manual/flng_fleet.csv를 변환만 한다.
      - name: FLNG 선단 집계
        continue-on-error: true
        run: python scripts/aggregate_flng.py

      # GEM LNG 트래커(운반선·터미널·Gas Finance) 변환 — 원본은 manual/gem/에 수동으로 넣는다(CC BY 4.0)
      - name: GEM LNG 집계
        continue-on-error: true
        run: python scripts/aggregate_gem_lng.py
      - name: GEM 가스발전 집계
        continue-on-error: true
        run: python scripts/aggregate_gem_gas_power.py

      # 해운 탭 가스선 운임에서 LNG 계열만 천연가스 탭으로 복제(네트워크 없음, 변환만)
      - name: LNG 운임 복제
        continue-on-error: true
        run: python scripts/derive_lng_freight.py

      # 글로벌 오더북 → 선종별 발주·인도 카드(변환만). 오더북 JSON은 로컬 수동 갱신이라 값은 그때 바뀐다.
      - name: 오더북 발주·인도 통계
        continue-on-error: true
        run: python scripts/derive_orderbook_stats.py

      # 운임 선물 ETF BWET·BDRY (Yahoo Finance, 키 없음)
      - name: 운임 선물 ETF 수집
        continue-on-error: true
        run: python scripts/fetch_freight_etf.py

      # 반도체 소부장 무역 (관세청 품목별 국가별 수출입실적). 매월 15일경 전월분 확정.
      - name: 관세청 무역통계 수집
        continue-on-error: true
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python scripts/fetch_customs.py

      # 일본 재무성 월별 수출: e-Stat 공개 CSV, API 키 없음. 과거 연도 정정도 확인.
      - name: 일본 블랭크마스크 관련 무역통계 수집
        continue-on-error: true
        run: python scripts/fetch_japan_customs.py

      # 에스앤에스텍 분기 실적(수기입력 CSV) x 전국 블랭크마스크 수출 비교. 키 불필요.
      - name: 에스앤에스텍 비교 집계
        continue-on-error: true
        run: python scripts/aggregate_snstech.py

      # DART 공개 HTML. 최근 정기보고서·정정 접수번호를 확인하며 원문 누적값을 분기로 변환.
      - name: 에스앤에스텍 생산능력·생산실적 검증
        run: python -m unittest discover -s scripts -p test_snstech_production.py
      - name: 에스앤에스텍 생산 공시 수집
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/fetch_snstech_production.py

      # 공식 IR 확인값과 사용자 HOYA·AGC 시트 스냅샷을 변환한다. 새 발표·시트 자동 수집은 하지 않는다.
      - name: 일본 블랭크마스크 공급사 IR 집계
        continue-on-error: true
        run: |
          python -m unittest discover -s scripts -p test_agc_sheet.py
          python -m unittest discover -s scripts -p test_hoya_sheet.py
          python scripts/aggregate_blankmask_ir.py
          python scripts/aggregate_agc_sheet.py
          python scripts/aggregate_hoya_sheet.py

      # ASML 노광기 기술별 판매 대수(수기 CSV, 분기 발표자료 이미지에서 옮겨 적음) — 합계·연간 대조 검증 포함
      - name: ASML 노광기 판매 집계
        continue-on-error: true
        run: python scripts/aggregate_asml.py

      # ASML 지역별 매출(SEC 반기·연간보고서 글자 표, 키 없음) — 새 제출만 받아 data/_asml 캐시에 붙인다
      - name: ASML 지역별 매출 수집
        continue-on-error: true
        run: python scripts/fetch_asml_regions.py

      # DART 국내 조선 4사 수주 공시 증분 수집. 원문 미저장(--no-docs).
      - name: DART 수주 공시 수집
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_extractor.py --watchlist data/_dart/watchlist.txt --no-docs

      # 수주 집계 (테이블 + 선종별 척당단가 + 예상매출 진행/납기)
      - name: 수주 집계
        continue-on-error: true
        run: python scripts/aggregate_korea_orders.py

      # 기관 수급: DART 대량보유(5%) 시장 전체 증분 수집 + 집계
      - name: 헤지펀드 성과·자산·SEC RAUM 검증
        run: |
          python -m unittest discover -s scripts -p test_hedge_funds.py
          node scripts/test_hedge_fund_cards.cjs
      - name: 미국 운용사·헤지펀드 지표 수집
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/fetch_hedge_funds.py

      - name: 대량보유 공시 수집
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_major_holdings.py
      - name: 대량보유 상세(지분율) 수집
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_holding_details.py
      - name: 대량보유 집계
        continue-on-error: true
        run: python scripts/aggregate_major_holdings.py

      # 증여 계획은 소유상황 변동과 별도로 수집하며 완료로 추정하지 않는다.
      - name: 증여 계획 파서·정정·철회 검증
        run: python -m unittest discover -s scripts -p test_gift_plans.py -v
      - name: 증여 계획 표·필터 검증
        run: node scripts/test_gift_plans.cjs
      - name: 증여 거래계획 수집
        continue-on-error: true
        timeout-minutes: 15
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_gift_plans.py
      - name: 증여 거래계획 집계
        continue-on-error: true
        run: python scripts/aggregate_gift_plans.py
      # 대주주 증여: 임원·주요주주 소유보고 원문에서 증여/수증 추출 + 집계
      - name: 증여 공시 수집
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_gifts.py
      - name: 증여 집계
        continue-on-error: true
        run: python scripts/aggregate_gifts.py

      # 전력: EIA-860M. 발행월(월 1회)이 새로 뜬 경우에만 xlsx 1개를 받아 빈티지에 덧붙인다.
      # 최초 빈티지 구축은 로컬 `--backfill`로 이미 끝나 있어야 한다(66개월·700MB라 CI에서 안 돌린다).
      - name: EIA-860M 발전 설비 수집
        continue-on-error: true
        run: python scripts/fetch_eia860m.py
      - name: EIA-860M 집계
        continue-on-error: true
        run: python scripts/aggregate_eia860m.py

      # 전력 수요: EIA-930. API 키 불필요(공개 벌크 CSV).
      # 과거 반기 파일은 고정이라 CI는 **현재 반기 파일만** 다시 받는다(약 48MB).
      - name: EIA-930 전력 수요 수집
        continue-on-error: true
        run: python scripts/fetch_eia930.py
      - name: EIA-930 집계
        continue-on-error: true
        run: python scripts/aggregate_eia930.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/
          git diff --cached --quiet || (git commit -m "chore: data update (market + DART orders)" && git push)
