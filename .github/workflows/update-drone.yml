name: update-drone
on:
  schedule:
    - cron: '25 0 * * *' # KST 09:25, completed US sessions
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  drone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 tzdata
      - name: Validate financial periods and completed-session prices
        id: precheck
        continue-on-error: true
        run: python -m unittest discover -s scripts -p test_drone.py -v
      - name: Refresh drone accounts and prices
        if: steps.precheck.outcome == 'success'
        run: python -u scripts/fetch_drone.py
      - name: Validate published history
        id: postcheck
        if: steps.precheck.outcome == 'success'
        continue-on-error: true
        run: python -m unittest discover -s scripts -p test_drone.py -v
      - name: Commit drone data only
        if: steps.precheck.outcome == 'success' && steps.postcheck.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/drone/
          git diff --cached --quiet || git commit -m "chore: refresh drone accounts and prices"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
      - name: Report validation failure
        if: steps.precheck.outcome == 'failure' || steps.postcheck.outcome == 'failure'
        run: exit 1
