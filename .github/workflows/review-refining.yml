name: review-refining-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect public original statements
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u scripts/collect_refining_sources.py --full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refining-public-originals
          path: .cache/refining/
          include-hidden-files: true
          retention-days: 3
