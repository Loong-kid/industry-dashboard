name: update-ppi
on:
  schedule:
    - cron: '0 23 9-19 * *' # Monthly release window, KST days 10-20 at 08:00
    - cron: '0 23 * * 0' # Weekly revision check, Monday KST 08:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Validate PPI calculations and parsing
        run: |
          python -m unittest discover -s scripts -p test_ppi.py
          node scripts/test_ppi.cjs
      - name: Collect industry PPI histories
        run: python -u scripts/fetch_ppi.py
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ppi/
          git diff --cached --quiet || git commit -m "chore: refresh industry PPI snapshots"
          git pull --rebase
          git push
