name: backfill-holdings
on:
  workflow_dispatch:
    inputs:
      start:
        description: First disclosure date
        default: '20220101'
        required: true
permissions:
  contents: read
concurrency:
  group: backfill-holdings
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Collect institution history
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BACKFILL_START: ${{ inputs.start }}
        run: python -u scripts/backfill_holdings.py --from "$BACKFILL_START"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holdings-backfill
          path: work/holdings-backfill/
          retention-days: 7
