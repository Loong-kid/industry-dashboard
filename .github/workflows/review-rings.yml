name: review-ring-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  statements:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect original Si and SiC parts issuer accounts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u scripts/collect_ring_sources.py --full-history
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ring-original-statements
          path: .cache/rings/
          include-hidden-files: true
          retention-days: 3
