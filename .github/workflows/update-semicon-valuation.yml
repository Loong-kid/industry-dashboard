name: update-semicon-valuation
on:
  schedule:
    - cron: '10 23 * * *' # KST 08:10
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests tzdata
      - name: Validate semiconductor valuation
        id: precheck
        continue-on-error: true
        run: |
          python -m unittest discover -s scripts -p test_semicon_valuation.py -v
          node scripts/test_semicon_valuation.cjs
      - name: Refresh prices and reported fundamentals
        if: steps.precheck.outcome == 'success'
        run: python -u scripts/fetch_semicon_valuation.py
      - name: Validate publication
        id: postcheck
        if: steps.precheck.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest discover -s scripts -p test_semicon_valuation.py -v
          node scripts/test_semicon_valuation.cjs
      - name: Commit valuation data only
        if: steps.precheck.outcome == 'success' && steps.postcheck.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/semicon/valuation/*.json
          git diff --cached --quiet || git commit -m "chore: refresh semiconductor prices and valuation"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
      - name: Report validation failure
        if: steps.precheck.outcome == 'failure' || steps.postcheck.outcome == 'failure'
        run: exit 1
